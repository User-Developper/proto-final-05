<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Sélection du client</title>

    <link
            rel="stylesheet"
            th:href="@{/css/client-selector.css}">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="step-header">

        <h1>
            <i class="fa-solid fa-user-check"></i>
            Sélectionner un client
        </h1>

        <p>
            Sélectionnez le client pour lequel vous souhaitez effectuer un signalement.
        </p>

    </div>


    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-card">

        <div class="search-input-wrapper">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                    type="text"
                    id="searchClient"
                    placeholder="Rechercher une ville ou une adresse..."
                    autocomplete="off">

            <div id="suggestions"></div>

        </div>

    </div>


    <!-- =========================
         SELECTED CLIENT
    ========================== -->

    <div
            class="selected-card"
            id="selectedClientCard">

        <button
                type="button"
                class="deselect-button"
                id="deselectClient"
                aria-label="Désélectionner le client"
                title="Désélectionner">

            <i class="fa-solid fa-xmark"></i>

        </button>

        <div class="selected-label">
            Client sélectionné
        </div>

        <div
                class="selected-name"
                id="selectedClient">

            Aucun client sélectionné

        </div>

        <div
                class="selected-zone"
                id="selectedZone">

            Sélectionnez un client sur la carte.

        </div>

        <span
                class="active-badge"
                id="activeBadge">

            <i class="fa-solid fa-circle-check"></i>
            Client sélectionné

        </span>

    </div>


    <!-- =========================
         MAP
    ========================== -->

    <div class="map-card">

        <div class="map-header">

            <i class="fa-solid fa-map-location-dot"></i>

            Carte des clients

        </div>

        <div id="map"></div>

    </div>


    <!-- =========================
         FORM / BOTTOM BAR
    ========================== -->

    <div class="bottom-bar">

        <form
                th:action="@{/client-selector}"
                method="post">

            <input
                    type="hidden"
                    name="clientId"
                    id="clientId">

            <button
                    type="submit"
                    class="btn-primary"
                    disabled>

                <i class="fa-solid fa-arrow-right"></i>

                Continuer le signalement

            </button>

        </form>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script
        th:inline="javascript">

    window.clients = /*[[${clients}]]*/ [];

</script>

<script
        th:src="@{/js/client-selector.js}">
</script>

</body>

</html>
