<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Localisation - Signalement</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/create-report-step-0.css}">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<main class="create-report-page">

    <div class="container">


        <!-- PROCESSUS -->

        <div class="step-header">

            <div class="steps">

                <div class="step-column completed">

                    <div class="step-circle">
                        1
                    </div>

                    <div class="step-label">
                        Informations
                    </div>

                </div>


                <div class="step-line active"></div>


                <div class="step-column active">

                    <div class="step-circle">
                        2
                    </div>

                    <div class="step-label">
                        Localisation
                    </div>

                </div>


                <div class="step-line"></div>


                <div class="step-column">

                    <div class="step-circle">
                        3
                    </div>

                </div>

            </div>

        </div>


        <form th:action="@{/create-report-step-0}"
              method="post">


            <!-- CLIENT -->

            <section class="section client-section">

                <h2>
                    Client
                </h2>


                <div
                        class="client-card"
                        th:if="${activeClient != null}">

                    <div class="client-card-main">

                        <div class="client-avatar">

                            <i class="fa-solid fa-building"></i>

                        </div>


                        <div class="client-details">

                            <strong
                                    class="client-name"
                                    th:text="${activeClient.name}">
                                Client
                            </strong>

                            <span
                                    class="client-city"
                                    th:text="${activeClient.city}">
                                Ville
                            </span>

                        </div>

                    </div>


                    <div class="client-status">
                        Sélectionné
                    </div>

                </div>


                <div
                        class="client-warning"
                        th:if="${activeClient == null}">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <div>

                        <strong>
                            Aucun client sélectionné
                        </strong>

                        <p>
                            Veuillez sélectionner un client avant de continuer.
                        </p>

                    </div>

                </div>

            </section>


            <!-- RECHERCHE DU LIEU -->

            <section class="section location-section">

                <h2>
                    Rechercher le lieu
                </h2>


                <div class="search-box">

                    <div class="search-icon">

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </div>


                    <input
                            type="text"
                            id="searchInput"
                            placeholder="Rechercher une adresse"
                            autocomplete="off">


                    <div
                            id="suggestions"
                            class="suggestions">
                    </div>

                </div>


                <!-- CARTE -->

                <div class="map-card">


                    <div
                            class="map-client-zone"
                            th:if="${activeClient != null}">

                        <i class="fa-solid fa-location-dot"></i>

                        <span>
                            Zone du client
                        </span>

                    </div>


                    <div id="map"></div>


                    <button
                            type="button"
                            class="gps-btn"
                            id="locateBtn">

                        <i class="fa-solid fa-location-crosshairs"></i>

                        Me localiser

                    </button>

                </div>


                <!-- ADRESSE -->

                <div class="address-card">

                    <div class="address-icon">

                        <i class="fa-solid fa-location-dot"></i>

                    </div>


                    <div class="address-content">

                        <span class="address-label">
                            Adresse sélectionnée
                        </span>

                        <p id="address">
                            Aucune position sélectionnée
                        </p>

                    </div>

                </div>

            </section>


            <!-- DONNÉES -->

            <input
                    type="hidden"
                    id="latitude"
                    name="latitude">


            <input
                    type="hidden"
                    id="longitude"
                    name="longitude">


            <input
                    type="hidden"
                    id="location"
                    name="location">


            <input
                    type="hidden"
                    id="clientId"
                    name="clientId"
                    th:value="${activeClient != null ? activeClient.id : ''}">


            <!-- ACTIONS -->

            <div class="sticky-actions">


                <button
                        type="button"
                        class="btn-back"
                        onclick="history.back()">

                    <i class="fa-solid fa-arrow-left"></i>

                    Retour

                </button>


                <button
                        type="submit"
                        class="btn-primary"
                        id="nextButton"
                        disabled>

                    Continuer

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </div>

        </form>

    </div>

</main>


<script th:inline="javascript">
    window.activeClient = /*[[${activeClient}]]*/ null;
</script>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script th:src="@{/js/create-report-step-0.js}"
        defer></script>


<script th:src="@{/js/app.js}"
        defer></script>


<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
