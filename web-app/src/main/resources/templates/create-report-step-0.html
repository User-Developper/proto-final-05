<form th:action="@{/create-report-step-0}" method="post">

    <div class="page">

        <!-- HEADER -->
        <div class="step-header">
            <h1>Localisation</h1>
            <p>Étape 2 / 3 — Choisis précisément le lieu</p>

            <div class="progress-bar">
                <div class="progress step2"></div>
            </div>
        </div>

        <!-- SEARCH AUTOCOMPLETE -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher une adresse..." autocomplete="off">
            <div id="suggestions" class="suggestions"></div>
        </div>

        <!-- MAP -->
        <div class="map-card">
            <div id="map"></div>

            <button type="button" class="gps-btn" id="locateBtn">
                📍 Me localiser
            </button>
        </div>

        <!-- ADDRESS -->
        <div class="address-card">
            <span class="label">Adresse sélectionnée</span>
            <p id="address">Aucune position sélectionnée</p>
        </div>

        <!-- HIDDEN -->
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
        <input type="hidden" id="location" name="location">

    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">

        <button type="button" class="btn-back" onclick="history.back()">
            ← Retour
        </button>

        <button type="submit" class="btn-next">
            Continuer →
        </button>



    </div>

</form>

<script>
    document.addEventListener("DOMContentLoaded", function () {

    /*const map = L.map('map').setView([46.603354, 1.888334], 6);*/
    const map = L.map('map').setView([45.603354, 1.688334], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let marker = null;

    const searchInput = document.getElementById("searchInput");
    const suggestionsBox = document.getElementById("suggestions");

    const latInput = document.getElementById("latitude");
    const lngInput = document.getElementById("longitude");
    const locationInput = document.getElementById("location");
    const addressBox = document.getElementById("address");

    // ===== REVERSE GEOCODING =====
    function reverseGeocode(lat, lng) {
        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
            .then(r => r.json())
            .then(data => {
                const addr = data.display_name || "Adresse inconnue";
                addressBox.textContent = addr;
                locationInput.value = addr;
            });
    }

    // ===== SET MARKER =====
    function setMarker(lat, lng) {

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lng], { draggable: true }).addTo(map);

        map.setView([lat, lng], 16);

        latInput.value = lat;
        lngInput.value = lng;

        reverseGeocode(lat, lng);

        marker.on("dragend", function () {
            const p = marker.getLatLng();
            setMarker(p.lat, p.lng);
        });
    }

    // ===== AUTOCOMPLETE =====
    let timeout = null;

    searchInput.addEventListener("input", function () {

        clearTimeout(timeout);

        const query = this.value;
        if (query.length < 3) {
            suggestionsBox.innerHTML = "";
            return;
        }

        timeout = setTimeout(() => {

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
                .then(r => r.json())
                .then(data => {

                    suggestionsBox.innerHTML = "";

                    data.slice(0, 5).forEach(item => {

                        const div = document.createElement("div");
                        div.className = "suggestion-item";
                        div.textContent = item.display_name;

                        div.onclick = () => {
                            setMarker(item.lat, item.lon);
                            searchInput.value = item.display_name;
                            suggestionsBox.innerHTML = "";
                        };

                        suggestionsBox.appendChild(div);
                    });

                });

        }, 300);
    });

    // ===== CLICK MAP =====
    map.on("click", function (e) {
        setMarker(e.latlng.lat, e.latlng.lng);
    });

    // ===== GPS =====
    document.getElementById("locateBtn").addEventListener("click", function () {

        navigator.geolocation.getCurrentPosition(function (pos) {
            setMarker(pos.coords.latitude, pos.coords.longitude);
        });

    });

});
</script>
