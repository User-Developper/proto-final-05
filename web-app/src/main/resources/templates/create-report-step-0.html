<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Localisation - Signalement</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/create-report-step-0.css}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<form
        th:action="@{/create-report-step-0}"
        method="post">

    <div class="page">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="step-header">

            <h1>
                <i class="fa-solid fa-location-dot"></i>
                Localisation
            </h1>

            <p>
                Étape 2 / 3 — Choisissez précisément le lieu du signalement
            </p>

            <div class="progress-bar">
                <div class="progress step2"></div>
            </div>

        </div>


        <!-- =========================
             ACTIVE CLIENT
        ========================== -->

        <div
                class="client-info-card"
                th:if="${activeClient != null}">

            <div class="client-info-icon">

                <i class="fa-solid fa-building"></i>

            </div>

            <div class="client-info-content">

                <span class="client-info-label">
                    Client sélectionné
                </span>

                <strong
                        class="client-info-name"
                        th:text="${activeClient.name}">
                    Client
                </strong>

                <span
                        class="client-info-location"
                        th:text="${activeClient.city}">
                    Ville
                </span>

            </div>

        </div>


        <!-- =========================
             NO ACTIVE CLIENT
        ========================== -->

        <div
                class="client-warning"
                th:if="${activeClient == null}">

            <i class="fa-solid fa-triangle-exclamation"></i>

            <div>

                <strong>
                    Aucun client sélectionné
                </strong>

                <p>
                    Veuillez sélectionner un client avant de continuer.
                </p>

            </div>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-box">

            <div class="search-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <input
                    type="text"
                    id="searchInput"
                    placeholder="Rechercher une adresse..."
                    autocomplete="off">

            <div
                    id="suggestions"
                    class="suggestions">
            </div>

        </div>


        <!-- =========================
             MAP
        ========================== -->

        <div class="map-card">

            <div
                    class="map-client-zone"
                    th:if="${activeClient != null}">

                <i class="fa-solid fa-crosshairs"></i>

                Zone du client

            </div>

            <div id="map"></div>

            <button
                    type="button"
                    class="gps-btn"
                    id="locateBtn">

                <i class="fa-solid fa-location-crosshairs"></i>

                Me localiser

            </button>

        </div>


        <!-- =========================
             ADDRESS
        ========================== -->

        <div class="address-card">

            <div class="address-header">

                <div class="address-icon">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <div>

                    <span class="label">
                        Adresse sélectionnée
                    </span>

                    <p
                            id="address">
                        Aucune position sélectionnée
                    </p>

                </div>

            </div>

        </div>


        <!-- =========================
             HIDDEN VALUES
        ========================== -->

        <input
                type="hidden"
                id="latitude"
                name="latitude">

        <input
                type="hidden"
                id="longitude"
                name="longitude">

        <input
                type="hidden"
                id="location"
                name="location">

        <input
                type="hidden"
                id="clientId"
                name="clientId"
                th:value="${activeClient != null ? activeClient.id : ''}">

    </div>


    <!-- =========================
         BOTTOM BAR
    ========================== -->

    <div class="bottom-bar">

        <button
                type="button"
                class="btn-back"
                onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

            Retour

        </button>


        <button
                type="submit"
                class="btn-next"
                id="nextButton"
                disabled>

            Continuer

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</form>


<!-- =========================
     ACTIVE CLIENT DATA
========================== -->

<script th:inline="javascript">

    /*
     * Thymeleaf injecte ici le client actif.
     *
     * Le JavaScript pourra ensuite utiliser :
     *
     * activeClient.latitude
     * activeClient.longitude
     * activeClient.zoom
     * activeClient.name
     * activeClient.city
     * activeClient.address
     * activeClient.perimeter
     */

    window.activeClient = /*[[${activeClient}]]*/ null;

</script>


<!-- =========================
     LEAFLET
========================== -->

<script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =========================
     REPORT STEP 0 JS
========================== -->

<script
        th:src="@{/js/create-report-step-0.js}"
        defer>
</script>


<div th:replace="~{fragments/footer :: footer}"></div>


<script
        th:src="@{/js/app.js}"
        defer>
</script>


</body>

</html>
