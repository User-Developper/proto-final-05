<th:block th:fragment="header" xmlns:sec="http://www.w3.org/1999/xhtml">

    <header class="app-header">

        <button class="burger-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="app-logo">
            Alert
        </div>

        <a th:href="@{/profile}" class="profile-btn">
            <i class="fa-solid fa-user"></i>
        </a>

    </header>

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div class="user">
                <div class="avatar">
                    <i class="fa-solid fa-circle-user"></i>
                </div>

                <div class="user-info">

                    <div sec:authorize="isAuthenticated()">

                        <strong sec:authentication="principal.username">
                            Mon compte
                        </strong>

                        <a th:href="@{/profile}">
                            Voir profil
                        </a>

                    </div>

                    <div sec:authorize="isAnonymous()">

                        <strong>Visiteur</strong>

                        <a th:href="@{/signin}">
                            Se connecter
                        </a>

                    </div>

                </div>
            </div>

            <button class="close-btn" onclick="toggleSidebar()">✕</button>

        </div>

        <nav class="sidebar-nav">

            <a th:href="@{/}">
                <i class="fa-solid fa-house"></i>
                Accueil
            </a>


            <a th:href="@{/create-report}">
                <i class="fa-solid fa-triangle-exclamation"></i>
                Signaler un problème
            </a>


            <a th:href="@{/report-list}">
                <i class="fa-solid fa-list"></i>
                Mes signalements
            </a>


            <a th:href="@{/map}">
                <i class="fa-solid fa-map"></i>
                Carte
            </a>


            <a th:href="@{/profile}">
                <i class="fa-solid fa-user"></i>
                Profil
            </a>


            <a th:href="@{/logout}" class="danger">

                <i class="fa-solid fa-right-from-bracket"></i>
                Déconnexion

            </a>

        </nav>

<!--        <div class="sidebar-footer">-->
<!--            <small>Alert v1.0</small>-->
<!--        </div>-->

    </div>

    <div id="sidebar-overlay"
         class="sidebar-overlay"
         onclick="toggleSidebar()"></div>

</th:block>
