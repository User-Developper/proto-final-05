<th:block th:fragment="header" xmlns:sec="http://www.w3.org/1999/xhtml">

    <header class="app-header">

        <button class="burger-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="app-logo">
            Alert
        </div>

        <a th:href="@{/profile}" class="profile-btn">
            <i class="fa-solid fa-user"></i>
        </a>

    </header>

    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">

            <div class="user">
                <div class="avatar">
                    <i class="fa-solid fa-circle-user"></i>
                </div>

                <div class="user-info">
                    <strong sec:authentication="principal.username">Mon compte</strong>
                    <small th:href="@{/profile}">Voir profil</small>
                </div>
            </div>

            <button class="close-btn" onclick="toggleSidebar()">✕</button>

        </div>

        <nav class="sidebar-nav">

            <a th:href="@{/profile}">
                <i class="fa-solid fa-user"></i>
                Profil
            </a>

            <a th:href="@{/settings}">
                <i class="fa-solid fa-gear"></i>
                Paramètres
            </a>

            <a th:href="@{/security}">
                <i class="fa-solid fa-shield"></i>
                Sécurité
            </a>

            <a th:href="@{/logout}" class="danger">
                <i class="fa-solid fa-right-from-bracket"></i>
                Déconnexion
            </a>

        </nav>

<!--        <div class="sidebar-footer">-->
<!--            <small>Alert v1.0</small>-->
<!--        </div>-->

    </div>

    <div id="sidebar-overlay"
         class="sidebar-overlay"
         onclick="toggleSidebar()"></div>

</th:block>
