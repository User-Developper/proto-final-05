<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Profil utilisateur</title>


    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<a th:href="@{/client-selector}">
    Choix du client
</a>
<h2>Profil utilisateur</h2>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MOBILE NAV -->
<div th:replace="~{fragments/mobile-nav :: mobile-nav}"></div>

<main class="profile-page">

    <div class="profile-layout">

        <!-- SIDEBAR -->
        <aside class="profile-sidebar">

            <div class="profile-card">

                <div class="avatar">
                    <i class="fa-solid fa-circle-user"></i>
                </div>

                <h3 sec:authentication="principal.username">
                    Utilisateur
                </h3>

                <p>Compte utilisateur</p>

            </div>

            <nav class="profile-menu">

                <a href="#"
                   class="menu-link active"
                   data-panel="profile-panel">

                    <i class="fa-solid fa-user"></i>

                    Mon profil

                </a>

                <a href="#"
                   class="menu-link"
                   data-panel="reports-panel">

                    <i class="fa-solid fa-list-check"></i>

                    Mes signalements

                </a>

                <hr>

                <a th:href="@{/logout}" class="logout">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Déconnexion

                </a>

            </nav>

        </aside>

        <!-- CONTENU -->
        <section class="profile-content">

            <!-- ========================= -->
            <!-- PROFIL -->
            <!-- ========================= -->

            <div id="profile-panel">

                <div class="content-header">

                    <h1>Mon profil</h1>

                    <p>
                        Consultez vos informations personnelles.
                    </p>

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Nom d'utilisateur</label>

                        <input
                                type="text"
                                th:value="${user.username}"
                                readonly>

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                                type="email"
                                th:value="${user.email}"
                                readonly>

                    </div>

                </div>

            </div>

            <!-- ========================= -->
            <!-- SIGNALMENTS -->
            <!-- ========================= -->

            <div id="reports-panel" class="hidden">

                <div class="content-header">

                    <h1>Mes signalements</h1>

                </div>

                <div th:if="${#lists.isEmpty(reports)}"
                     class="empty-state">

                    <i class="fa-solid fa-seedling"></i>

                    <h2>Aucun signalement</h2>

                    <p>

                        Vous n'avez encore créé aucun signalement.

                    </p>

                    <a th:href="@{/create-report}"
                       class="primary-btn">

                        Créer un signalement

                    </a>

                </div>

                <div th:unless="${#lists.isEmpty(reports)}">

                    <div class="report-card"
                         th:each="report : ${reports}">

                        <h3 th:text="${report.title}">
                            Titre
                        </h3>

                        <p th:text="${report.description}">
                            Description
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </div>



</main>

<script th:src="@{/js/profile.js}" defer></script>

<script th:src="@{/js/app.js}"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
