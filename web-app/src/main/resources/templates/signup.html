
<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inscription</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/signup.css}">

</head>


<body>

<div class="signup-page">

    <main class="signup-container">


        <!-- IDENTITÉ DE L'APPLICATION -->
        <div class="signup-brand">

            <div class="brand-mark">
                <span>●</span>
            </div>

            <div class="brand-name">
                Signalement
            </div>

            <p class="brand-baseline">
                Signaler. Suivre. Agir.
            </p>

        </div>


        <!-- CARTE D'INSCRIPTION -->
        <div class="signup-card">


            <!-- FORMULAIRE -->
            <form th:action="@{/signup}"
                  th:object="${signupForm}"
                  method="post">


                <!-- NOM -->
                <div class="form-group">

                    <label for="username">

                        Nom

                        <span>*</span>

                    </label>

                    <input
                            type="text"
                            id="username"
                            th:field="*{username}"
                            autocomplete="username"
                            required
                    >

                </div>


                <!-- PRÉNOM -->
                <div class="form-group">

                    <label for="prenom">

                        Prénom

                        <span>*</span>

                    </label>

                    <input
                            type="text"
                            id="prenom"
                            th:field="*{prenom}"
                            autocomplete="given-name"
                            required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">

                        Adresse e-mail

                        <span>*</span>

                    </label>

                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            autocomplete="email"
                            required
                    >

                </div>


                <!-- MOT DE PASSE -->
                <div class="form-group">

                    <label for="password">

                        Mot de passe

                        <span>*</span>

                    </label>

                    <div class="password-wrapper">

                        <input
                                type="password"
                                id="password"
                                th:field="*{password}"
                                autocomplete="new-password"
                                required
                        >

                        <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Afficher le mot de passe"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- CONFIRMATION MOT DE PASSE -->
                <div class="form-group">

                    <label for="confirmPassword">

                        Confirmation du mot de passe

                        <span>*</span>

                    </label>

                    <div class="password-wrapper">

                        <input
                                type="password"
                                id="confirmPassword"
                                th:field="*{confirmPassword}"
                                autocomplete="new-password"
                                required
                        >

                        <button
                                type="button"
                                class="password-toggle"
                                id="confirmPasswordToggle"
                                aria-label="Afficher la confirmation du mot de passe"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- CONDITIONS -->
                <div class="form-group checkbox-group">

                    <label class="checkbox-label">

                        <input
                                type="checkbox"
                                th:field="*{terms}"
                                required
                        >

                        <span>

                            J'accepte les
                            <a href="#">conditions d'utilisation</a>
                            et la
                            <a href="#">politique de confidentialité</a>.

                        </span>

                    </label>

                </div>


                <!-- BOUTON INSCRIPTION -->
                <button
                        type="submit"
                        class="signup-button"
                >

                    Je m'inscris

                </button>


            </form>


            <!-- CONNEXION -->
            <div class="login-section">

                <p>
                    Déjà un compte ?
                </p>

                <a th:href="@{/signin}">
                    Se connecter
                </a>

            </div>


        </div>


        <!-- TEXTE BAS DE PAGE -->
        <p class="signup-footer">

            Une plateforme pour signaler et suivre les problèmes
            de votre environnement.

        </p>


    </main>

</div>


<!-- JAVASCRIPT -->
<script th:src="@{/js/signup.js}"></script>

</body>

</html>
