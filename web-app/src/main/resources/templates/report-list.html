<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Signalements - Alert</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/report-list.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MOBILE NAV -->
<div th:replace="~{fragments/mobile-nav :: mobile-nav}"></div>

<main class="reports-page">

    <!-- PAGE HEADER -->
    <section class="page-header">
        <h1>Signalements</h1>
        <p>Consultez les incidents signalés par la communauté</p>
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">

        <form th:action="@{/report-list}"
              method="get"
              class="search-container">

            <input type="text"
                   name="q"
                   id="searchInput"
                   th:value="${search}"
                   placeholder="Rechercher un signalement...">

            <button type="submit" class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <!-- conserver les filtres actifs -->
            <input type="hidden"
                   name="category"
                   th:value="${selectedCategory}">

            <input type="hidden"
                   name="gravity"
                   th:value="${selectedGravity}">

        </form>

        <button class="filter-btn" id="openFilters">
            <i class="fa-solid fa-filter"></i>
            Filtres
        </button>

    </div>

    <!-- GRID -->
    <section class="reports-grid">

        <article class="report-card"
                 th:each="report : ${reports.content}">

            <!-- IMAGE (disabled for now)
            <img class="report-image"
                 th:src="${report.imageUrl != null ? report.imageUrl : '/img/default-report.jpg'}"
                 alt="Signalement">
            -->

            <div class="report-content">

                <h3 th:text="${report.title}">Titre</h3>

                <div class="badges">

                    <span class="badge type"
                          th:text="${report.category}">
                        Type
                    </span>

                    <span class="badge gravity"
                          th:text="${report.gravity}">
                        Gravité
                    </span>

                </div>

                <p class="description"
                   th:text="${#strings.abbreviate(report.description,120)}">
                </p>

                <!-- DATE (later enable)
                <div class="date">
                    <i class="fa-regular fa-calendar"></i>
                    <span th:text="${#temporals.format(report.createdAt,'dd/MM/yyyy')}"></span>
                </div>
                -->

            </div>

        </article>

    </section>

    <!-- PAGINATION -->
    <div class="pagination">

        <a th:if="${currentPage > 0}"
           th:href="@{/report-list(page=${currentPage - 1}, category=${selectedCategory},
        gravity=${selectedGravity},
        q=${search})}">
            Précédent
        </a>

        <span th:text="${currentPage + 1}"></span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/report-list(page=${currentPage + 1}, category=${selectedCategory},
        gravity=${selectedGravity},
        q=${search})}">
            Suivant
        </a>

    </div>

</main>

<!-- FILTER BOTTOM SHEET -->
<div class="filter-sheet" id="filterSheet">

    <div class="sheet-header">
        <h3>Filtres</h3>
        <button id="closeFilters">✕</button>
    </div>

    <div class="sheet-body">

        <!-- Catégorie -->
        <div class="filter-group">

            <label for="categoryFilter">
                Catégorie
            </label>

            <select id="categoryFilter" class="filter-select">

                <option value="">
                    Toutes
                </option>

                <option value="AIR_POLLUTION">
                    Pollution de l'air
                </option>

                <option value="WATER_POLLUTION">
                    Pollution de l'eau
                </option>

                <option value="SOIL_POLLUTION">
                    Pollution des sols
                </option>

                <option value="NOISE">
                    Bruit
                </option>

                <option value="WASTE">
                    Déchets
                </option>

                <option value="VEGETATION">
                    Végétation
                </option>

                <option value="TOXIC_PRODUCTS">
                    Produits toxiques
                </option>

            </select>

        </div>

        <!-- Gravité -->
        <div class="filter-group">

            <label for="gravityFilter">
                Gravité
            </label>

            <select id="gravityFilter" class="filter-select">

                <option value="">
                    Toutes
                </option>

                <option value="BASIC">
                    Faible
                </option>

                <option value="MEDIUM">
                    Moyenne
                </option>

                <option value="HIGH">
                    Élevée
                </option>

                <option value="CRITICAL">
                    Critique
                </option>

            </select>

        </div>

    </div>

    <div class="sheet-footer">

        <button class="apply-btn">
            Appliquer
        </button>

    </div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- SCRIPTS -->
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/report-list.js}"></script>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
