<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Signalements - EchoVOCE</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/report-list.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/mobile-nav :: mobile-nav}"></div>

<main class="reports-page">

    <section class="page-header">
        <h1>Signalements</h1>
        <p>Consultez les incidents signalés par la communauté</p>
    </section>

    <div class="toolbar">

        <div class="search-container">
            <input type="text"
                   id="searchInput"
                   placeholder="Rechercher un signalement..."
                   aria-label="Rechercher un signalement">

            <button class="search-btn"
                    id="searchBtn"
                    type="button"
                    aria-label="Rechercher">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <button class="filter-btn"
                id="openFilters"
                type="button">
            <i class="fa-solid fa-filter"></i>
            Filtres
        </button>

    </div>

    <section class="reports-grid" id="reportsGrid"></section>

    <div class="pagination" id="pagination"></div>

</main>

<div class="filter-sheet" id="filterSheet">

    <div class="sheet-header">
        <h3>Filtres</h3>
        <button id="closeFilters"
                type="button"
                aria-label="Fermer les filtres">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="sheet-body">

        <div class="filter-group">
            <label for="categoryFilter">Catégorie</label>

            <select id="categoryFilter" class="filter-select">
                <option value="">Toutes</option>
                <option value="AIR_POLLUTION">Air</option>
                <option value="WATER_POLLUTION">Eau</option>
                <option value="SOIL_POLLUTION">Sol</option>
                <option value="NOISE">Bruit</option>
                <option value="WASTE">Déchets</option>
                <option value="VEGETATION">Végétation</option>
                <option value="TOXIC_PRODUCTS">Produits toxiques</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="gravityFilter">Gravité</label>

            <select id="gravityFilter" class="filter-select">
                <option value="">Toutes</option>
                <option value="LOW">Faible</option>
                <option value="MEDIUM">Moyenne</option>
                <option value="HIGH">Élevée</option>
            </select>
        </div>

    </div>

</div>

<div class="overlay" id="overlay"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/report-list.js}"></script>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
