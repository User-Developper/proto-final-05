<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/signin.css}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Connexion</h1>

        <form th:action="@{/signin}" method="post">

            <div>
                <label>Username *</label>
                <input type="text" name="username" id="username">
                <small class="error" id="usernameError"></small>
            </div>

            <div>
                <label>Password *</label>
                <input type="password" name="password" id="password">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit">
                Se connecter
            </button>

        </form>

        <div th:if="${param.error}" class="error-box">
            ❌ Username ou mot de passe incorrect
        </div>

        <div class="links"><a href="#" id="forgotPassword">Mot de passe oublié ?</a></div>


        <div class="links">
            <a th:href="@{/signup}">Pas encore inscrit ? Créez un compte</a>
        </div>

    </div>

</div>

<script th:src="@{/js/signin.js}"></script>
</body>

</html>
