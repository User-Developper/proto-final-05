<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${report.title}">
        Signalement
    </title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/report.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div th:replace="fragments/header :: header"></div>


<main class="report-page">

    <div class="report-container">


        <!-- RETOUR -->

        <a th:href="@{/report-list}"
           class="back-link">

            <i class="fa-solid fa-arrow-left"></i>

            Retour aux signalements

        </a>


        <!-- CONTENU DU SIGNALEMENT -->

        <article class="report-content">


            <!-- EN-TÊTE -->

            <header class="report-header">


                <!-- AVATAR UTILISATEUR -->

                <div class="report-user-avatar">

                    <i class="fa-solid fa-user"></i>

                </div>


                <!-- TITRE -->

                <h1 th:text="${report.title}">
                    Titre du signalement
                </h1>


                <!-- CATÉGORIE + DATE -->

                <div class="report-meta">


                    <!-- CATÉGORIE -->

                    <span class="report-category"
                          th:if="${report.category != null}"
                          th:text="${report.category}">
                        Catégorie
                    </span>


                    <!-- DATE -->

                    <span class="report-date"
                          th:if="${report.date != null}">

                        <i class="fa-regular fa-calendar"></i>

                        <span th:text="${#temporals.format(report.date, 'dd/MM/yyyy')}">
                            01/01/2026
                        </span>

                    </span>

                </div>

            </header>


            <!-- IMAGES -->

            <section class="report-images"
                     th:if="${reportImages != null and !reportImages.isEmpty()}">


                <!-- IMAGE PRINCIPALE -->

                <div class="main-image">

                    <img th:src="@{'/report-images/' + ${report.id} + '/' + ${reportImages[0].storageName}}"
                         th:alt="${reportImages[0].fileName}">

                </div>


                <!-- GALERIE -->

                <div class="image-gallery"
                     th:if="${reportImages.size() > 1}">

                    <div class="gallery-image"
                         th:each="image, stat : ${reportImages}"
                         th:if="${stat.index > 0}">

                        <img th:src="@{'/report-images/' + ${report.id} + '/' + ${image.storageName}}"
                             th:alt="${image.fileName}">

                    </div>

                </div>

            </section>


            <!-- DESCRIPTION -->

            <section class="report-description"
                     th:if="${report.description != null and !report.description.isBlank()}">

                <h2>
                    Description
                </h2>

                <p th:text="${report.description}">
                    Description du signalement
                </p>

            </section>


            <!-- LOCALISATION -->

            <section class="report-location"
                     th:if="${report.location != null and !report.location.isBlank()}">

                <div class="section-heading">


                    <div class="location-information">

                        <span class="section-label">
                            LOCALISATION
                        </span>

                        <h2 th:text="${report.location}">
                            Localisation
                        </h2>

                    </div>


                    <!-- CARTE -->

                    <a th:if="${report.latitude != null and report.longitude != null}"
                       th:href="@{'https://www.google.com/maps/search/?api=1&query=' + ${report.latitude} + ',' + ${report.longitude}}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="map-button">

                        <i class="fa-solid fa-location-dot"></i>

                        Voir sur la carte

                    </a>

                </div>

            </section>


            <!-- AUCUNE IMAGE -->

            <section class="report-no-image"
                     th:if="${reportImages == null or reportImages.isEmpty()}">

                <div class="no-image-content">

                    <i class="fa-regular fa-image"></i>

                    <span>
                        Aucune image disponible
                    </span>

                </div>

            </section>


            <!-- ACTIONS -->

            <section class="report-actions">


                <button type="button"
                        class="report-action">

                    <i class="fa-solid fa-pen"></i>

                    Modifier

                </button>


                <button type="button"
                        class="report-action">

                    <i class="fa-solid fa-trash"></i>

                    Supprimer

                </button>


                <button type="button"
                        class="report-action">

                    <i class="fa-solid fa-box-archive"></i>

                    Archiver

                </button>

            </section>


        </article>

    </div>

</main>


<div th:replace="fragments/footer :: footer"></div>


<script th:src="@{/js/app.js}"></script>

</body>

</html>
