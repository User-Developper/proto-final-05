<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nouveau signalement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/create-report.css}">
</head>

<body>

<div class="container">

    <!-- HEADER STEP -->
    <div class="step-header">
        <h1>Nouveau signalement</h1>
        <p>Étape 1 / 3 — Informations du signalement</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

    <form th:action="@{/create-report}" th:object="${reportForm}" method="post">

        <!-- CATEGORY -->
        <div class="section">
            <h2>Type de signalement</h2>

            <div class="category-grid">

                <label class="category-card">
                    <input type="radio" th:field="*{category}" value="AIR_POLLUTION">
                    🌫 Air
                </label>

                <label class="category-card">
                    <input type="radio" th:field="*{category}" value="WATER_POLLUTION">
                    💧 Eau
                </label>

                <label class="category-card">
                    <input type="radio" th:field="*{category}" value="VEGETATION">
                    🌿 Végétation
                </label>

                <label class="category-card">
                    <input type="radio" th:field="*{category}" value="TOXIC_PRODUCTS">
                    ☠ Produits toxiques
                </label>
            </div>
        </div>

        <!-- TITLE -->
        <div class="section">
            <h2>Titre</h2>
            <input type="text" name="title" th:field="*{title}" placeholder="Ex: Odeur suspecte près du parc">
        </div>

        <!-- DESCRIPTION -->
        <div class="section">
            <h2>Description</h2>
            <textarea name="description" rows="5" th:field="*{description}"
                      placeholder="Décris la situation en détail..."></textarea>
        </div>

        <!-- GRAVITY -->
        <div class="section">
            <h2>Gravité</h2>

            <div class="gravity-grid">

                <label class="gravity basic">
                    <input type="radio" th:field="*{gravity}" value="BASIC">
                    🟢 Basique
                </label>

                <label class="gravity medium">
                    <input type="radio" th:field="*{gravity}" value="MEDIUM">
                    🟡 Moyen
                </label>

                <label class="gravity high">
                    <input type="radio" th:field="*{gravity}" value="HIGH">
                    🟠 Élevé
                </label>

                <label class="gravity critical">
                    <input type="radio" th:field="*{gravity}" value="CRITICAL">
                    🔴 Critique
                </label>

            </div>
        </div>

        <!-- LOCATION (simple version step 1) -->
        <div class="section">
            <h2>Localisation</h2>

            <input type="text" name="location"  th:field="*{location}" placeholder="Adresse ou lieu">

            <button type="button" class="location-btn">
                📍 Utiliser ma position actuelle
            </button>
        </div>

        <!-- SUBMIT -->
        <div class="actions">
            <button type="submit" class="btn-primary">
                Continuer
            </button>
        </div>

    </form>

</div>

</body>
</html>
