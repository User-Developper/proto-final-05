
services:



  patient-service:
    image: devocin08/patient-service
    mem_limit: 700m
    ports:
      - "8081:8082"
    networks:
      - healthcare-app
    depends_on:
      - consul

    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      SPRING_PROFILES_ACTIVE: default
#      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_CLOUD_CONSUL_HOST: consul
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-medical:3306/medical_db"

  web-app:
    image: devocin08/web-app
    mem_limit: 700m
    ports:
      - "8084:8083"
    networks:
      - healthcare-app
    depends_on:
      - patient-service
      - consul

#    deploy:
#      restart_policy:
#        condition: on-failure
#        delay: 5s
#        max_attempts: 3
#        window: 120s
    environment:
        SPRING_PROFILES_ACTIVE: default
        #      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
        SPRING_CLOUD_CONSUL_HOST: consul
        MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
        MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"


  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - healthcare-app
#    healthcheck:
#      test: "curl --fail --silent localhost:8500/v1/status/leader | grep . || exit 1"
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 10s
#    depends_on:
#      -
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 120s






  mysql:
    image: mysql:8.0
    container_name: mysql-medical
    mem_limit: 700m
    restart: always

    ports:
      - "3308:3306"


    networks:
      - healthcare-app



    environment:
      MYSQL_ROOT_PASSWORD: mddb
      MYSQL_DATABASE: medical_db
#      MYSQL_USER: medical_user
#      MYSQL_PASSWORD: medical_pass



#    volumes:
#      - mysql_data:/var/lib/mysql
#      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
#
#volumes:
#  mysql_data:




networks:
  healthcare-app:
    driver: bridge



